  let idx = 0, wordsVisible = true;
  const img=document.getElementById('cardImg'), word=document.getElementById('cardWord'),
        counter=document.getElementById('counter'), dotsEl=document.getElementById('dots'),
        toggle=document.getElementById('toggle');
  CARDS.forEach((c,i)=>{ const d=document.createElement('button'); d.className='dot'+(i===0?' active':''); d.onclick=()=>go(i); dotsEl.appendChild(d); });
  function render(){
    const c=CARDS[idx];
    img.src=c.img; img.alt=c.word;
    word.textContent=c.word;
    word.classList.toggle('hidden', !wordsVisible);
    counter.textContent=(idx+1)+' / '+CARDS.length;
    [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active',i===idx));
  }
  function go(i){ idx=(i+CARDS.length)%CARDS.length; render(); }
  document.getElementById('prev').onclick=()=>go(idx-1);
  document.getElementById('next').onclick=()=>go(idx+1);
  toggle.onclick=()=>{ wordsVisible=!wordsVisible; toggle.innerHTML = wordsVisible ? '\uD83D\uDE48 Masquer les mots' : '\uD83D\uDC41\uFE0F Afficher les mots'; render(); };
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')go(idx-1); if(e.key==='ArrowRight')go(idx+1); });
  render();
</script>

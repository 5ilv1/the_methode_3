<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 21 — Britain has got talent — Flashcards</title>
<style>
  :root{--bg:#eef4fb;--card:#ffffff;--accent:#2f5c9e;--accent2:#e94f8a;--ink:#22303f;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:linear-gradient(160deg,#eef4fb,#dbe7f6);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
  h1{font-size:clamp(18px,4vw,26px);margin:6px 0 2px;color:var(--accent);text-align:center}
  .sub{font-size:13px;color:#5b6b7d;margin-bottom:14px;text-align:center}
  .flag{font-size:22px}
  .stage{position:relative;width:min(92vw,520px)}
  .card{background:var(--card);border-radius:22px;box-shadow:0 12px 30px rgba(30,60,110,.18);padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;min-height:430px;justify-content:center;border:3px solid #fff}
  .imgwrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:300px}
  .imgwrap img{max-width:100%;max-height:330px;object-fit:contain}
  .word{margin-top:10px;font-size:clamp(24px,6vw,34px);font-weight:700;color:var(--accent);letter-spacing:.5px;min-height:44px;text-align:center}
  .word.excl{color:var(--accent2)}
  .word.hidden{visibility:hidden}
  .nav{position:absolute;top:50%;transform:translateY(-50%);border:none;background:var(--accent);color:#fff;width:46px;height:46px;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;transition:.15s}
  .nav:hover{background:#24487d}
  .prev{left:-14px} .next{right:-14px}
  .bar{display:flex;align-items:center;gap:14px;margin-top:16px}
  .dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:300px}
  .dot{width:11px;height:11px;border-radius:50%;background:#b9cbe4;border:none;cursor:pointer;padding:0}
  .dot.active{background:var(--accent2);transform:scale(1.25)}
  .counter{font-weight:700;color:var(--accent);font-size:15px;min-width:52px;text-align:center}
  .toggle{margin-top:16px;border:none;background:var(--accent2);color:#fff;padding:11px 20px;border-radius:30px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 10px rgba(233,79,138,.35)}
  .toggle:hover{filter:brightness(1.06)}
  .hint{font-size:12px;color:#7a8a9c;margin-top:10px}
</style>
</head>

  ];
  let i=0, wordsHidden=false;
  const img=document.getElementById('cimg'), word=document.getElementById('cword'),
        counter=document.getElementById('counter'), dots=document.getElementById('dots');
  cards.forEach((c,idx)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>go(idx);dots.appendChild(b);});
  function render(){
    const c=cards[i];
    img.src=c.img; img.alt=c.word;
    word.textContent=c.word;
    word.className='word'+(c.kind==='excl'?' excl':'')+(wordsHidden?' hidden':'');
    counter.textContent=(i+1)+' / '+cards.length;
    [...dots.children].forEach((d,idx)=>d.classList.toggle('active',idx===i));
  }
  function go(n){i=(n+cards.length)%cards.length;render();}
  document.getElementById('prev').onclick=()=>go(i-1);
  document.getElementById('next').onclick=()=>go(i+1);
  document.getElementById('toggle').onclick=function(){
    wordsHidden=!wordsHidden;
    this.textContent=wordsHidden?'👁️ Afficher les mots':'🙈 Masquer les mots';
    render();
  };
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(i-1);if(e.key==='ArrowRight')go(i+1);});
  render();
</script>

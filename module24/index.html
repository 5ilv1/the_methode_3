<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4R Competition — Reduce, Reuse, Repair, Recycle</title>
<style>
  :root { --green:#2e7d32; --ink:#20331f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; background:#eef5ec; color:var(--ink);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  h1 { color:var(--green); font-size:clamp(18px,3.4vw,26px); margin:4px 0 10px; text-align:center; }
  h1 span { display:block; font-size:.62em; font-weight:normal; color:#5c8a56; }
  .carousel { background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(30,80,40,.18);
              width:min(560px,94vw); padding:16px 16px 12px; }
  .stage { position:relative; }
  .slide { display:none; }
  .slide.active { display:block; animation:fade .35s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .imgwrap { height:min(340px,52vh); display:flex; align-items:center; justify-content:center;
             background:#f4f9f2; border-radius:12px; overflow:hidden; }
  .imgwrap img { max-width:100%; max-height:100%; object-fit:contain; }
  .word { text-align:center; margin:12px 4px 2px; font-size:clamp(20px,4.6vw,30px); font-weight:bold; color:var(--green);
          min-height:1.3em; letter-spacing:.3px; }
  .word.hidden { visibility:hidden; }
  .controls { display:flex; align-items:center; justify-content:space-between; margin-top:6px; gap:8px; }
  .arrow { border:none; background:var(--green); color:#fff; width:46px; height:46px; border-radius:50%;
           font-size:22px; cursor:pointer; line-height:1; box-shadow:0 3px 8px rgba(30,80,40,.3); }
  .arrow:active { transform:translateY(1px); }
  .counter { font-weight:bold; color:#5c8a56; font-size:15px; min-width:52px; text-align:center; }
  .dots { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin:12px 0 4px; }
  .dot { width:11px; height:11px; border-radius:50%; border:none; background:#c3ddbc; cursor:pointer; padding:0; }
  .dot.active { background:var(--green); transform:scale(1.25); }
  .toggle { display:block; margin:10px auto 2px; border:2px solid var(--green); background:#fff; color:var(--green);
            font-weight:bold; padding:9px 16px; border-radius:22px; cursor:pointer; font-size:15px; }
  .toggle:active { transform:translateY(1px); }
</style>
</head>

    <div class="controls">
      <button class="arrow" id="prev" aria-label="Précédent">&#8249;</button>
      <div class="counter"><span id="cur">1</span> / 10</div>
      <button class="arrow" id="next" aria-label="Suivant">&#8250;</button>
    </div>
    <div class="dots">
      <button class="dot active" data-i="0" aria-label="Carte 1"></button>
      <button class="dot" data-i="1" aria-label="Carte 2"></button>
      <button class="dot" data-i="2" aria-label="Carte 3"></button>
      <button class="dot" data-i="3" aria-label="Carte 4"></button>
      <button class="dot" data-i="4" aria-label="Carte 5"></button>
      <button class="dot" data-i="5" aria-label="Carte 6"></button>
      <button class="dot" data-i="6" aria-label="Carte 7"></button>
      <button class="dot" data-i="7" aria-label="Carte 8"></button>
      <button class="dot" data-i="8" aria-label="Carte 9"></button>
      <button class="dot" data-i="9" aria-label="Carte 10"></button>
    </div>
    <button class="toggle" id="toggle">🙈 Masquer les mots</button>
  </div>
<script>
  const slides=[...document.querySelectorAll('.slide')];
  const dots=[...document.querySelectorAll('.dot')];
  const cur=document.getElementById('cur');
  let i=0, wordsHidden=false;
  function show(n){
    i=(n+slides.length)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle('active',k===i));
    dots.forEach((d,k)=>d.classList.toggle('active',k===i));
    cur.textContent=i+1;
  }
  document.getElementById('next').onclick=()=>show(i+1);
  document.getElementById('prev').onclick=()=>show(i-1);
  dots.forEach(d=>d.onclick=()=>show(+d.dataset.i));
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')show(i+1); if(e.key==='ArrowLeft')show(i-1); });
  const words=[...document.querySelectorAll('.word')];
  const toggle=document.getElementById('toggle');
  toggle.onclick=()=>{
    wordsHidden=!wordsHidden;
    words.forEach(w=>w.classList.toggle('hidden',wordsHidden));
    toggle.textContent=wordsHidden?'👁️ Afficher les mots':'🙈 Masquer les mots';
  };
</script>

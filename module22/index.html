let idx = 0, showWords = true;
const img=document.getElementById('cardImg'), word=document.getElementById('cardWord'),
      counter=document.getElementById('counter'), dots=document.getElementById('dots'),
      toggle=document.getElementById('toggle');
function render(){
  const c=CARDS[idx];
  img.src=c.img; word.textContent=c.word;
  word.classList.toggle('hidden', !showWords);
  counter.textContent=(idx+1)+' / '+CARDS.length;
  [...dots.children].forEach((d,i)=>d.classList.toggle('active',i===idx));
}
function go(n){ idx=(n+CARDS.length)%CARDS.length; render(); }
CARDS.forEach((_,i)=>{ const d=document.createElement('div'); d.className='dot'; d.onclick=()=>go(i); dots.appendChild(d); });
document.getElementById('prev').onclick=()=>go(idx-1);
document.getElementById('next').onclick=()=>go(idx+1);
toggle.onclick=()=>{ showWords=!showWords; toggle.innerHTML = showWords ? '&#128584; Masquer les mots' : '&#128065;&#65039; Afficher les mots'; render(); };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')go(idx-1); if(e.key==='ArrowRight')go(idx+1); });
render();
</script>

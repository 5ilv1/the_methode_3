<style>
  :root{--blue:#4a6fa5;--ink:#2b2b2b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Trebuchet MS',Verdana,sans-serif;background:linear-gradient(160deg,#eaf1f8,#f7ecec);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;color:var(--ink)}
  h1{font-size:1.5rem;color:var(--blue);margin-bottom:4px;text-align:center}
  .sub{font-size:.85rem;color:#7a7a7a;margin-bottom:14px;text-align:center}
  .stage{width:min(92vw,540px)}
  .card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(60,80,120,.20);overflow:hidden;position:relative}
  .imgwrap{width:100%;aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .imgwrap img{width:100%;height:100%;object-fit:contain}
  .word{padding:14px 10px 18px;text-align:center;font-size:1.7rem;font-weight:bold;color:var(--blue);letter-spacing:.4px}
  .word.hidden{visibility:hidden}
  .nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
  button.arrow{border:none;background:var(--blue);color:#fff;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 10px rgba(60,80,120,.3);transition:transform .1s}
  button.arrow:active{transform:scale(.92)}
  .counter{font-size:1rem;color:#555;font-weight:bold;min-width:54px;text-align:center}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .dot{width:11px;height:11px;border-radius:50%;background:#c3cede;cursor:pointer;transition:background .2s}
  .dot.active{background:var(--blue)}
  .toggle{display:block;margin:16px auto 0;border:2px solid var(--blue);background:#fff;color:var(--blue);padding:9px 18px;border-radius:30px;font-size:.95rem;font-weight:bold;cursor:pointer}
  .toggle:active{transform:scale(.96)}
</style>

CARDS.forEach((c,k)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>{i=k;render()};dots.appendChild(d);});
function render(){
  const c=CARDS[i];
  img.src=c.img; img.alt=c.word;
  word.textContent=c.word;
  word.className='word'+(show?'':' hidden');
  counter.textContent=(i+1)+' / '+CARDS.length;
  [...dots.children].forEach((d,k)=>d.className='dot'+(k===i?' active':''));
}

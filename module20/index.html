<style>
  :root{ --card:#ffffff; --ink:#1f3a5f; --accent:#2f6fb0; --bg1:#eaf3fb; --bg2:#dced9d;}

  .dot{width:11px;height:11px;border-radius:50%;background:#b9cfe6;border:none;cursor:pointer;padding:0;}
  .dot.active{background:var(--accent);transform:scale(1.25);}
  .row{display:flex;gap:12px;align-items:center;}
  .counter{font-size:15px;color:#47698f;font-weight:600;}
  .toggle{border:none;cursor:pointer;background:#1f3a5f;color:#fff;font-size:15px;font-weight:600;

  let i=0, show=true;
  const img=document.getElementById('cimg'),word=document.getElementById('cword'),
        counter=document.getElementById('counter'),dots=document.getElementById('dots'),
        toggle=document.getElementById('toggle');
  cards.forEach((c,k)=>{const d=document.createElement('button');d.className='dot'+(k===0?' active':'');
    d.addEventListener('click',()=>{i=k;render();});dots.appendChild(d);});
  function render(){
    const c=cards[i];img.src=c.img;img.alt=c.w;word.textContent=c.w;
    word.classList.toggle('hidden',!show);
    counter.textContent=(i+1)+' / '+cards.length;
    [...dots.children].forEach((d,k)=>d.classList.toggle('active',k===i));
  }
  function go(n){i=(i+n+cards.length)%cards.length;render();}
  document.getElementById('prev').addEventListener('click',()=>go(-1));
  document.getElementById('next').addEventListener('click',()=>go(1));
  toggle.addEventListener('click',()=>{show=!show;
    toggle.innerHTML=show?'&#128584; Masquer les mots':'&#128065;&#65039; Afficher les mots';render();});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);
    if(e.key==='ArrowRight')go(1);if(e.key===' '){e.preventDefault();toggle.click();}});
  render();
